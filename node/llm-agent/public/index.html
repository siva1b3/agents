<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Agent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0e0e0e;
            --surface:   #161616;
            --border:    #2a2a2a;
            --muted:     #444;
            --text:      #e0e0e0;
            --dim:       #888;
            --accent:    #00d4aa;
            --tool-bg:   #111;
            --tool-border:#1e3a33;
            --error:     #ff4d4d;
            --user-bg:   #1a1a1a;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── Layout ── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 860px;
            margin: 0 auto;
        }

        header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        header h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
        }

        header span {
            margin-left: auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        /* ── Chat area ── */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar { width: 4px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ── Messages ── */
        .message { display: flex; flex-direction: column; gap: 8px; }

        .message.user { align-items: flex-end; }
        .message.agent { align-items: flex-start; }

        .bubble {
            padding: 10px 14px;
            border-radius: 4px;
            max-width: 75%;
            font-size: 13.5px;
            line-height: 1.65;
        }

        .message.user .bubble {
            background: var(--user-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .message.agent .bubble {
            background: transparent;
            border: none;
            padding: 0;
            max-width: 100%;
        }

        .answer-text {
            color: var(--text);
            font-size: 13.5px;
            line-height: 1.7;
        }

        .meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        /* ── Tool trace ── */
        .tool-trace {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .trace-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }

        .tool-step {
            background: var(--tool-bg);
            border: 1px solid var(--tool-border);
            border-radius: 3px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.2s ease;
        }

        .tool-step-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-num {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            min-width: 20px;
        }

        .tool-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
        }

        .tool-args {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--dim);
            padding-left: 28px;
        }

        .tool-result {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: #666;
            padding-left: 28px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            border-left: 2px solid var(--tool-border);
            padding: 4px 8px 4px 12px;
            margin-left: 28px;
        }

        .tool-result::-webkit-scrollbar { width: 3px; }
        .tool-result::-webkit-scrollbar-thumb { background: var(--border); }

        /* ── Loading ── */
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 4px; height: 4px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        .loading-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        /* ── Error ── */
        .error-msg {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--error);
            border: 1px solid #3a1a1a;
            background: #1a0a0a;
            padding: 10px 14px;
            border-radius: 3px;
        }

        /* ── Input area ── */
        #input-area {
            padding: 16px 24px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #question {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 13.5px;
            resize: none;
            outline: none;
            min-height: 42px;
            max-height: 120px;
            transition: border-color 0.15s;
            line-height: 1.5;
        }

        #question:focus { border-color: var(--accent); }
        #question::placeholder { color: var(--muted); }

        #send-btn {
            background: var(--accent);
            border: none;
            border-radius: 3px;
            padding: 10px 18px;
            color: #000;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: opacity 0.15s;
            white-space: nowrap;
            height: 42px;
        }

        #send-btn:hover { opacity: 0.85; }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Empty state ── */
        #empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
        }

        #empty-state .big {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 28px;
            color: var(--border);
        }

        #empty-state p {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .suggestion {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--dim);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 2px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%       { opacity: 1;   transform: scale(1);   }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0);   }
        }
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="dot"></div>
        <h1>DB Agent</h1>
        <span id="model-label">gpt-4o</span>
    </header>

    <div id="chat">
        <div id="empty-state">
            <div class="big">_</div>
            <p>Ask anything about your database</p>
            <div class="suggestions">
                <div class="suggestion" onclick="useSuggestion(this)">list all tables</div>
                <div class="suggestion" onclick="useSuggestion(this)">how many customers do we have?</div>
                <div class="suggestion" onclick="useSuggestion(this)">show top 5 orders by price</div>
                <div class="suggestion" onclick="useSuggestion(this)">which country has the most customers?</div>
            </div>
        </div>
    </div>

    <div id="input-area">
        <textarea id="question" placeholder="Ask a question about your database..." rows="1"></textarea>
        <button id="send-btn" onclick="sendQuestion()">RUN</button>
    </div>
</div>

<script>
    const chatEl   = document.getElementById('chat');
    const inputEl  = document.getElementById('question');
    const btnEl    = document.getElementById('send-btn');
    const emptyEl  = document.getElementById('empty-state');

    // auto-resize textarea
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendQuestion();
        }
    });

    function useSuggestion(el) {
        inputEl.value = el.textContent;
        inputEl.focus();
    }

    function removeEmptyState() {
        if (emptyEl) emptyEl.remove();
    }

    function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function appendUserMessage(text) {
        removeEmptyState();
        const el = document.createElement('div');
        el.className = 'message user';
        el.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatEl.appendChild(el);
        scrollToBottom();
    }

    function createAgentMessage() {
        const el = document.createElement('div');
        el.className = 'message agent';
        el.innerHTML = `<div class="bubble"><div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div><span class="loading-text">thinking...</span></div></div>`;
        chatEl.appendChild(el);
        scrollToBottom();
        return el;
    }

    function renderAgentMessage(el, data) {
        const bubble = el.querySelector('.bubble');

        if (!data.success) {
            bubble.innerHTML = `<div class="error-msg">Error: ${escapeHtml(data.message || 'Unknown error')}</div>`;
            return;
        }

        let html = '';

        // tool trace
        if (data.toolCalls && data.toolCalls.length > 0) {
            html += `<div class="tool-trace">`;
            html += `<div class="trace-label">Tool calls &mdash; ${data.toolCalls.length} step${data.toolCalls.length > 1 ? 's' : ''}</div>`;

            data.toolCalls.forEach((step, i) => {
                const argsStr = Object.keys(step.args || {}).length > 0
                    ? JSON.stringify(step.args)
                    : 'no args';

                const resultStr = JSON.stringify(step.result, null, 2);

                html += `
                <div class="tool-step">
                    <div class="tool-step-header">
                        <span class="step-num">${i + 1}.</span>
                        <span class="tool-name">${escapeHtml(step.tool)}</span>
                    </div>
                    <div class="tool-args">${escapeHtml(argsStr)}</div>
                    <div class="tool-result">${escapeHtml(resultStr)}</div>
                </div>`;
            });

            html += `</div>`;
        }

        // final answer
        html += `<div class="answer-text">${escapeHtml(data.answer)}</div>`;
        html += `<div class="meta">${data.iterations} iteration${data.iterations > 1 ? 's' : ''}</div>`;

        bubble.innerHTML = html;
        scrollToBottom();
    }

    async function sendQuestion() {
        const question = inputEl.value.trim();
        if (!question) return;

        inputEl.value = '';
        inputEl.style.height = 'auto';
        btnEl.disabled = true;

        appendUserMessage(question);
        const agentEl = createAgentMessage();

        try {
            const res = await fetch('/ask', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ question })
            });

            const data = await res.json();
            renderAgentMessage(agentEl, data);
        } catch (err) {
            renderAgentMessage(agentEl, { success: false, message: err.message });
        } finally {
            btnEl.disabled = false;
            inputEl.focus();
        }
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
