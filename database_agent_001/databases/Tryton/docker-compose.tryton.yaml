networks:
  tryton_app_global_network:
    name: tryton_app_global_network
    driver: bridge

volumes:
  tryton_app_postgres_data:
    name: tryton_app_postgres_data

services:
  tryton_app_postgres_service:
    image: postgres:18-bookworm
    container_name: tryton_app_postgres_service_container
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: tryton_app_db
    volumes:
      - tryton_app_postgres_data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d
    networks:
      - tryton_app_global_network
    ports:
      - "5433:5432"
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_user -d tryton_app_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  tryton_app_pgweb_service:
    image: sosedoff/pgweb:0.17.0
    container_name: tryton_app_pgweb_service_container
    environment:
      - PGWEB_DATABASE_URL=postgres://admin_user:admin_password@tryton_app_postgres_service_container:5432/tryton_app_db?sslmode=disable
    ports:
      - "8082:8081"
    networks:
      - tryton_app_global_network
    depends_on:
      tryton_app_postgres_service:
        condition: service_healthy
    restart: no
