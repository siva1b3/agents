networks:
  sports_app_global_network:
    name: sports_app_global_network
    driver: bridge

volumes:
  sports_app_postgres_data:
    name: sports_app_postgres_data

services:
  sports_app_postgres_service:
    image: postgres:18-bookworm
    container_name: sports_app_postgres_service_container
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: sports_app_db
    volumes:
      - sports_app_postgres_data:/var/lib/postgresql
      - ./datalayer/postgres:/docker-entrypoint-initdb.d
    networks:
      - sports_app_global_network
    ports:
      - "5432:5432"
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_user -d sports_app_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  sports_app_sportsdb_loader:
    image: postgres:18-bookworm
    container_name: sports_app_sportsdb_loader_container
    environment:
      PGPASSWORD: admin_password
    networks:
      - sports_app_global_network
    depends_on:
      sports_app_postgres_service:
        condition: service_healthy
    restart: no
    entrypoint: >
      bash -c "
        apt-get update -qq && apt-get install -y -qq curl &&
        BASE_URL=https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample &&
        for FILE in sportsdb_tables.sql sportsdb_inserts.sql sportsdb_indexes.sql sportsdb_constraints.sql sportsdb_fks.sql; do
          echo \"Loading $$FILE...\" &&
          curl -fsSL $$BASE_URL/$$FILE | psql -h sports_app_postgres_service_container -U admin_user -d sports_app_db;
        done &&
        echo \"SportsDB loaded successfully.\"
      "

  sports_app_pgweb_service:
    image: sosedoff/pgweb:0.17.0
    container_name: sports_app_pgweb_service_container
    environment:
      - PGWEB_DATABASE_URL=postgres://admin_user:admin_password@sports_app_postgres_service_container:5432/sports_app_db?sslmode=disable
    ports:
      - "8081:8081"
    networks:
      - sports_app_global_network
    depends_on:
      sports_app_postgres_service:
        condition: service_healthy
    restart: no
