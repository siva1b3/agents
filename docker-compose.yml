name: siva_test

services:
  dev-server:
    build: .
    container_name: dev-server

    ports:
      - "127.0.0.1:2222:22"
      - "3000:3000"
      - "4000:4000"
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
      - "5005:5005"

    volumes:
      - ./workspace:/home/dev/workspace
      - "C:/Users/siva1/.ssh/docker-dev-key.pub:/tmp/docker-dev-key.pub:ro"

    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /home/dev/.ssh
        cp /tmp/docker-dev-key.pub /home/dev/.ssh/authorized_keys
        chown -R dev:dev /home/dev/.ssh
        chmod 700 /home/dev/.ssh
        chmod 600 /home/dev/.ssh/authorized_keys
        exec /usr/sbin/sshd -D -e

    restart: unless-stopped
    init: true
