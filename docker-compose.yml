name: siva_test

services:
  ubuntu-dev:
    image: ubuntu:24.04
    container_name: ubuntu-dev

    ports:
      - "127.0.0.1:2222:22"
      - "3000:3000"
      - "4000:4000"
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
      - "5005:5005"

    volumes:
      - "C:/Users/siva1/.ssh/chatgpt_ubuntu_dev.pub:/tmp/chatgpt_ubuntu_dev.pub:ro"

    command:
      - /bin/bash
      - -ec
      - |
        if ! command -v sshd >/dev/null; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openssh-server git ca-certificates curl
        fi
        mkdir -p /root/.ssh /run/sshd
        chmod 700 /root/.ssh
        cp /tmp/chatgpt_ubuntu_dev.pub /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
        printf '%s\n' 'PermitRootLogin prohibit-password' 'PubkeyAuthentication yes' \
          > /etc/ssh/sshd_config.d/99-dev.conf
        ssh-keygen -A
        exec /usr/sbin/sshd -D -e

    restart: unless-stopped
    init: true
