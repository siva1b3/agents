name: siva_test

services:
  ubuntu-dev:
    image: ubuntu:24.04
    container_name: ubuntu-dev

    ports:
      - "127.0.0.1:2222:22"
      - "3000:3000"
      - "4000:4000"
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
      - "5005:5005"

    volumes:
      - "C:/Users/siva1/.ssh/chatgpt_ubuntu_dev.pub:/tmp/chatgpt_ubuntu_dev.pub:ro"
      - "./setup-ubuntu-dev.sh:/usr/local/bin/setup-ubuntu-dev.sh:ro"
      - "./install-codex.sh:/usr/local/bin/install-codex.sh:ro"
      - "./start-ubuntu-dev.sh:/usr/local/bin/start-ubuntu-dev.sh:ro"

    command:
      - /bin/bash
      - -ec
      - |
        bash /usr/local/bin/setup-ubuntu-dev.sh
        bash /usr/local/bin/install-codex.sh
        exec bash /usr/local/bin/start-ubuntu-dev.sh

    restart: unless-stopped
    init: true
